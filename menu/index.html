<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>المنيو | الحاجة</title>
  <meta name="theme-color" content="#1a0b2e">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
  <link href="../assets/css/main.css" rel="stylesheet">
  <link href="menu.css" rel="stylesheet">
</head>
<body data-root="../" data-page="menu">
  <div id="page-loader"></div>
  <div id="site-nav"></div>

  <section class="page-hero">
    <div class="container">
      <h1>المنيو</h1>
      <p>اختار اللي نفسك فيه وضيفه للعربة</p>

      <!-- طريقة الطلب -->
      <div class="mode-pills" role="tablist" aria-label="طريقة الطلب">
        <button class="mode" data-mode="delivery"><i class="bi bi-scooter"></i> ديليفري</button>
        <button class="mode" data-mode="pickup"><i class="bi bi-bag-check-fill"></i> استلام من الفرع</button>
        <button class="mode" data-mode="dinein"><i class="bi bi-cup-hot-fill"></i> على ترابيزة <span id="tableChip" class="chip"></span></button>
      </div>
      <div id="tableBox" class="table-box glass" hidden>
        <label for="tableNum" class="form-label mb-0">رقم الترابيزة</label>
        <input type="number" id="tableNum" class="form-control" min="1" placeholder="رقم">
        <button class="btn btn-gold btn-sm" id="saveTable">تأكيد</button>
      </div>
    </div>
  </section>

  <div class="toolbar">
    <div class="container">
      <div class="search-wrap"><i class="bi bi-search"></i><input id="search" type="search" class="form-control" placeholder="ابحث عن مشروب أو حلو أو مكسرات…" aria-label="بحث"></div>
      <div class="tabs" id="tabs" role="tablist"></div>
    </div>
  </div>

  <main class="container pb-5" id="menuRoot"></main>

  <a href="../cart/index.html" class="cart-bar" id="cartBar" hidden>
    <span><i class="bi bi-bag-heart-fill"></i> عرض العربة (<b id="barCount">0</b>)</span>
    <span id="barTotal"></span>
  </a>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="menu.js"></script>
</body>
</html>
